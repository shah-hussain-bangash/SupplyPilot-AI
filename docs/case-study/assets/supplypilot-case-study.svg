<title id="title">SupplyPilot AI controlled procurement architecture</title>
<desc id="desc">Source evidence supports constrained sourcing, manager approval, buyer dispatch, receiving and invoice checks. Purchasing uses a durable local ERP simulator. All three hosted CI jobs passed at commit 8d983bb. Seven small sourcing references were independently enumerated, without rerunning CP-SAT locally.</desc>
